services:
  mysql:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: auth
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
        - "3306:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: redis-auth
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]

volumes:
  mysql-auth-data: